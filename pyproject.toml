[tool.poetry]
name = "FastAPI-Template"
version = "1.0.0"
description = "Template for FastAPI with SQLAlchemy"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14,<4.0"

fastapi = { version = "0.138.0", extras = ["standard"] }
starlette = ">=1.3.1"
sqlalchemy = { version = "2.0.51", extras = ["asyncio"] }
psycopg = { version = "3.3.4", extras = ["binary", "pool"] }
cachetools = "7.1.4"
pydantic-settings = "2.14.2"
uvicorn = "0.49.0"
asyncpg = "0.31.0"
fastapi-filter = { version = "3.0.0", extras = ["sqlalchemy"] }
alembic = "1.18.4"

[tool.poetry.group.dev.dependencies]
httpx2 = "2.4.0"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-asyncio = "1.4.0"
ruff = "0.15.19"
testcontainers = "4.14.2"
psycopg2-binary = "2.9.12"
faker = "40.23.0"
factory-boy = "3.3.3"
pytest-subtests = "0.15.0"

[tool.fastapi]
entrypoint = "template.project_template.main:get_app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
exclude = [
    "common/*",
    "**/*.ipynb",
]
line-length = 100

[tool.ruff.lint]
extend-select = ["T201"]
select = ["E4", "E7", "E9", "F", "I"]

[tool.alembic]
script_location = "%(here)s/project_template/alembic"
prepend_sys_path = ["."]
revision_environment = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"